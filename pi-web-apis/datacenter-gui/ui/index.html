<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiosk Display</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<header id="menu-bar">
    <h1>Jericho</h1>
    <button onclick="showTriggers()" class="header-btn">Triggers</button>
    <button onclick="showDisplay()" class="header-btn">Display</button>
</header>
<div id="display-container">
    <div id="display-text">
        <div id="coin"> </div>
    </div>
    <div id="triggers">
        <button onclick="triggerEffectButton('nuclear')" id="nuclear-btn">Nuclear</button>
        <button onclick="triggerEffectButton('traffic')" id="traffic-btn">Traffic</button>
        <button onclick="triggerEffectButton('water')" id="water-btn">Water</button>
        <button onclick="triggerEffectButton('sound')" id="sound-btn">Sound</button>
    </div>

</div>

<script src="/js/app.js"></script>
</body>
</html>
